services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbe
      POSTGRES_PASSWORD: orbe_local_dev
      POSTGRES_DB: orbe
    ports:
      - "5432:5432"
    volumes:
      - orbe_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orbeadmin
      MINIO_ROOT_PASSWORD: OrbeMinio2026Secure
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orbe_minio:/data

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "5678:5678"
    volumes:
      - orbe_n8n:/home/node/.n8n

volumes:
  orbe_pg:
  orbe_minio:
  orbe_n8n:
